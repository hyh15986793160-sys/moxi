# 正式 HTTPS 配置。
# 把 moxi.example.com 全部替换成真实域名，并确认证书已签发。
# 与同机的 xiangq 完全并行：只是端口（8001）和静态目录（/opt/moxi）不同。

server {
    listen 80;
    listen [::]:80;
    server_name moxi.example.com;

    # 保留 ACME 路径，证书续期时不中断。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name moxi.example.com;

    ssl_certificate /etc/letsencrypt/live/moxi.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moxi.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml;

    # Vite 构建产物目录（发布包解压后的 sites/moxi）。
    root /opt/moxi/sites/moxi;
    index index.html;

    # 带内容哈希的产物可以长期缓存。
    location /assets/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # 只有接口需要转发给容器。
    location /api/ {
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # 轮询每秒一次，access log 会被刷满；排查问题时看 docker logs -f app。
        access_log off;
        proxy_pass http://127.0.0.1:8001;
    }

    location = /docs {
        proxy_pass http://127.0.0.1:8001;
    }

    location = /openapi.json {
        proxy_pass http://127.0.0.1:8001;
    }

    # 单页应用：文件不存在时回落到 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
